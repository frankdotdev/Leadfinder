<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadFinder - Open Source Local Business Lead Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-badge">
            <svg class="icon-zap" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Leads
          </div>
          <h1>LeadFinder</h1>
        </div>
        <p class="subtitle">Discover local business leads with no website, broken websites, or social-only presence.</p>
      </div>
    </header>

    <main>
      <form id="f" class="search-form">
        <div class="form-row">
          <div class="field-wrap" id="providerBox">
            <label for="provider">Map provider</label>
            <div class="select-wrapper">
              <select id="provider" aria-label="Map provider"></select>
            </div>
          </div>

          <div class="field-wrap" id="keyBox">
            <label for="key">API key</label>
            <input id="key" type="password" autocomplete="off" placeholder="Paste your Google API key">
          </div>

          <div class="field-wrap" id="cityBox">
            <label for="city">City</label>
            <input id="city" required placeholder="e.g. Enugu, Nigeria">
          </div>

          <div class="field-wrap" id="catBox">
            <label for="cat">Business type</label>
            <input id="cat" required placeholder="e.g. restaurant, salon, clinic">
          </div>

          <div class="field-wrap" id="gridBox">
            <label for="grid">Search grid</label>
            <input id="grid" type="number" min="1" max="10" value="4">
          </div>

          <div class="field-wrap button-wrap">
            <button id="go" type="submit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span class="btn-text">Search</span>
            </button>
          </div>
        </div>
      </form>

      <div class="status-panel">
        <div class="status-indicator"></div>
        <p id="status">Pick a city and business type to start finding leads.</p>
      </div>

      <nav id="tabs" class="tabs-nav" aria-label="Filter results by website status"></nav>

      <div class="action-bar">
        <div class="filter-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="q" placeholder="Filter results by name, email, phone, category...">
        </div>
        <button id="csv" type="button" class="btn-secondary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export CSV
        </button>
      </div>

      <div class="wrap">
        <table id="leadTable">
          <thead>
            <tr>
              <th class="th-done" title="Mark contacted">Done</th>
              <th class="th-biz">Business</th>
              <th class="th-email">Email</th>
              <th class="th-contact">Phone & Socials</th>
              <th class="th-status">Website Status</th>
              <th class="th-rating">Rating</th>
              <th class="th-map">Map</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <footer class="app-footer">
      <p>
        Built by <a href="https://frankoge.com" target="_blank" rel="noopener">Frank Oge</a> of <a href="https://hackversetechnologies.vercel.app" target="_blank" rel="noopener">Hackverse Technologies</a>
      </p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
